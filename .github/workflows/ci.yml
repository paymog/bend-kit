name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

env:
  BEND_NO_TELEMETRY: "1"
  BUN_VERSION: "1.4.2"

jobs:
  launchd-acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 20
    concurrency:
      group: camber-launchd-acceptance
      cancel-in-progress: false
    env:
      BUN_VERSION: "1.4.4"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install supported Bend
        run: |
          mkdir -p "$RUNNER_TEMP/launchd-bend"
          cd "$RUNNER_TEMP/launchd-bend"
          curl --proto '=https' --tlsv1.2 -fsSL -o bend.tar.gz \
            https://github.com/bendlang/bend/releases/download/v2.0.40/bend-2.0.40-darwin-arm64.tar.gz
          echo 'b2be003b041eb6cfc65326be18f79eb2e0bae2189be79a18c507e661b4b6900b  bend.tar.gz' | shasum -a 256 -c -
          tar -xzf bend.tar.gz
          echo "$RUNNER_TEMP/launchd-bend/bend/bin" >> "$GITHUB_PATH"
      - name: Install TLS proxy
        run: |
          brew install nginx
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Check supported host and exclusive runtime slot
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          launchctl print "gui/$(id -u)" > /dev/null
          if pgrep -l -x 'bend|bend2'; then
            echo 'Another Bend process owns the runtime slot' >&2
            exit 1
          fi
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 10 * 1024**3, "less than 10 GiB free disk"'
          bend version
          test "$(bun --version)" = '1.4.4'
      - name: Run sequential native and JavaScript launchd matrix
        run: |
          mkdir -p "$RUNNER_TEMP/launchd-receipts"
          python3 -B camber/deploy/run.py --lane all --case all \
            --output "$RUNNER_TEMP/launchd-receipts/current.json"
      - name: Upload cumulative passing and adverse receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launchd-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launchd-receipts/
          if-no-files-found: error
          retention-days: 30

  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      http: ${{ steps.list.outputs.http }}
      hairpin: ${{ steps.list.outputs.hairpin }}
      wire: ${{ steps.list.outputs.wire }}
      stream: ${{ steps.list.outputs.stream }}
      native: ${{ steps.list.outputs.native }}
      workflows: ${{ steps.workflows.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: workflows
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
            if grep -qE '^\.github/workflows/.*\.ya?ml$|^scripts/workflow-lint-test\.py$' <<<"$changed"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: list
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            pkgs=$(scripts/packages.sh "origin/${{ github.base_ref }}")
          else
            pkgs=$(scripts/packages.sh)
          fi
          {
            echo "packages=$(jq -Rnc '[inputs | select(length > 0)]' <<<"$pkgs")"
            echo "http=$(grep -qx http <<<"$pkgs" && echo true || echo false)"
            echo "hairpin=$(grep -qx hairpin <<<"$pkgs" && echo true || echo false)"
            echo "wire=$(grep -qx wire <<<"$pkgs" && echo true || echo false)"
            echo "stream=$(grep -qx stream <<<"$pkgs" && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          native=$(
            shopt -s nullglob
            for pkg in $pkgs; do
              cs=("$pkg"/effs/*.c)
              if [ ${#cs[@]} -gt 0 ]; then
                echo "$pkg"
              else
                case "$pkg" in commands|webhooks|f32array|bits) echo "$pkg" ;; esac
              fi
            done
          )
          echo "native=$(jq -Rnc '[inputs | select(length > 0)]' <<<"$native")" >> "$GITHUB_OUTPUT"
      - name: Check sibling pins
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          bash scripts/pins-check.sh
          python3 scripts/repin-check.py
          if grep -qE '(^|/)README\.md$|^scripts/(pins|packages)\.sh$|^scripts/pins\.allow$' <<<"$changed"; then
            scripts/pins.sh "$base"
          else
            mapfile -t pkgs < <(cut -d/ -f1 <<<"$changed" | sort -u | grep -xFf <(scripts/packages.sh) || true)
            if [ "${#pkgs[@]}" -gt 0 ]; then
              scripts/pins.sh "$base" "${pkgs[@]}"
            fi
          fi
      - name: Check macOS native package selection
        run: python3 scripts/macos-native-selection-test.py
      - name: Check CI pin selection
        run: python3 -B scripts/ci-pin-selection-test.py
      - name: Check process-tree RSS guard
        run: python3 -B scripts/rss-check-test.py

  workflow-lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint and ShellCheck
        run: |
          mkdir -p "$RUNNER_TEMP/workflow-lint"
          cd "$RUNNER_TEMP/workflow-lint"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$RUNNER_TEMP/workflow-lint" >> "$GITHUB_PATH"
      - name: Check workflows with ShellCheck
        run: actionlint -shellcheck "$(command -v shellcheck)"
      - name: Check workflow lint selection and failure handling
        run: python3 -B scripts/workflow-lint-test.py

  check:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, matrix.package) || format('publish-{0}', matrix.package) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Bend
        run: scripts/install-bend.sh
      - name: Check ${{ matrix.package }}
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          scripts/check.sh ${{ matrix.package }}
      - name: Native check ${{ matrix.package }}
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          if [ "${{ matrix.package }}" = http ]; then ulimit -v $((20 * 1024 * 1024)); fi
          scripts/native-check.sh ${{ matrix.package }}
      - name: Install cmark-gfm 0.29.0.gfm.14
        if: matrix.package == 'markdown'
        run: |
          git clone --depth 1 --branch 0.29.0.gfm.14 https://github.com/github/cmark-gfm.git "$RUNNER_TEMP/cmark-gfm"
          cmake -S "$RUNNER_TEMP/cmark-gfm" -B "$RUNNER_TEMP/cmark-gfm/build" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMARK_TESTS=OFF -DCMARK_SHARED=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cmark-gfm/install"
          cmake --build "$RUNNER_TEMP/cmark-gfm/build" --parallel 2
          cmake --install "$RUNNER_TEMP/cmark-gfm/build"
          echo "$RUNNER_TEMP/cmark-gfm/install/bin" >> "$GITHUB_PATH"
      - name: Check markdown GFM differential corpus
        if: matrix.package == 'markdown'
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          python3 markdown/conformance.py --gfm-diff
      - name: Install Bun
        if: matrix.package == 'dns' || matrix.package == 'http' || matrix.package == 'process' || hashFiles(format('{0}/ca-check.sh', matrix.package), format('{0}/mtls-check.sh', matrix.package)) != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Check HTTP startup sockets in native and JS
        if: matrix.package == 'http'
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          python3 -B http/startup_check.py
      - name: Check DNS JavaScript backend
        if: matrix.package == 'dns'
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          bend dns/check.bend -o "$RUNNER_TEMP/dns-check.js"
          bun "$RUNNER_TEMP/dns-check.js"
      - name: Check Hairpin with former ports occupied in native and JS
        if: matrix.package == 'hairpin'
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          python3 -B hairpin/occupied-run-test.py
          python3 -B scripts/rss-check.py bend hairpin/check.bend -o "$RUNNER_TEMP/hairpin-check"
          python3 -B hairpin/occupied-run.py "$RUNNER_TEMP/hairpin-check"
          bend hairpin/check.bend -o "$RUNNER_TEMP/hairpin-check.js"
          python3 -B hairpin/occupied-run.py bun "$RUNNER_TEMP/hairpin-check.js"
      - name: Check process JS backend
        if: matrix.package == 'process'
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          bend process/check.bend -o "$RUNNER_TEMP/bend-kit-process-check.js"
          bun "$RUNNER_TEMP/bend-kit-process-check.js"
          process/ownership-check.sh
      - name: CA and mTLS checks ${{ matrix.package }}
        if: hashFiles(format('{0}/ca-check.sh', matrix.package), format('{0}/mtls-check.sh', matrix.package)) != ''
        run: |
          if [ "${{ matrix.package }}" = wire ]; then export WIRE_LOOPBACK_ONLY=1; fi
          export PATH="$HOME/.bend/bin:$PATH"
          for s in ${{ matrix.package }}/ca-check.sh ${{ matrix.package }}/mtls-check.sh; do
            [ -f "$s" ] || continue
            echo "== $s native"; sh "$s"
            echo "== $s js"; sh "$s" js
          done
      - name: Compare ${{ matrix.package }} with the hub
        if: github.event_name == 'pull_request'
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          scripts/publish.sh --check ${{ matrix.package }}
      - name: Publish ${{ matrix.package }}
        if: github.event_name == 'push'
        env:
          BEND_KEY: ${{ secrets.BEND_KEY }}
          BEND_LOGIN: ${{ secrets.BEND_LOGIN }}
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          jq -n '{key: env.BEND_KEY, login: env.BEND_LOGIN}' > ~/.bend/bender.json
          scripts/publish.sh ${{ matrix.package }}

  stream-live:
    needs: changes
    if: needs.changes.outputs.stream == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify runner and head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then test "$(uname -sm)" = 'Darwin arm64'; fi
          actual=$(git rev-parse HEAD)
          printf 'tested=%s expected=%s\n' "$actual" "$EXPECTED_HEAD_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Bend
        run: |
          scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Select OpenSSL
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Check Stream live TCP and TLS in native and JS
        run: |
          python3 -B scripts/rss-check.py python3 -B stream/check.py
          python3 -B scripts/rss-check.py python3 -B stream/check.py --target js

  native-macos:
    needs: changes
    if: needs.changes.outputs.native != '[]'
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.native) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify runner and head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          actual=$(git rev-parse HEAD)
          printf 'tested=%s expected=%s\n' "$actual" "$EXPECTED_HEAD_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: oven-sh/setup-bun@v2
        if: matrix.package == 'dns' || matrix.package == 'process'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Bend
        run: |
          scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check native ${{ matrix.package }}
        run: scripts/native-check.sh ${{ matrix.package }}
      - name: Check DNS JavaScript backend
        if: matrix.package == 'dns'
        run: |
          bend dns/check.bend -o "$RUNNER_TEMP/dns-check.js"
          bun "$RUNNER_TEMP/dns-check.js"
      - name: Check process JavaScript and ownership
        if: matrix.package == 'process'
        run: |
          bend process/check.bend -o "$RUNNER_TEMP/process-check.js"
          bun "$RUNNER_TEMP/process-check.js"
          process/ownership-check.sh

  http-macos:
    needs: changes
    if: needs.changes.outputs.http == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify runner and head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          actual=$(git rev-parse HEAD)
          printf 'tested=%s expected=%s\n' "$actual" "$EXPECTED_HEAD_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Bend
        run: |
          scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check native HTTP package
        run: python3 -B scripts/rss-check.py scripts/native-check.sh http
      - name: Check HTTP startup sockets in native and JS
        run: python3 -B http/startup_check.py
      - name: Check local HTTP serving and streaming in native and JS
        run: bash http/local-smoke.sh

  http-tls-macos:
    needs: changes
    if: needs.changes.outputs.http == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify runner and head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          actual=$(git rev-parse HEAD)
          printf 'tested=%s expected=%s\n' "$actual" "$EXPECTED_HEAD_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Bend
        run: |
          scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Select OpenSSL
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Check HTTP CA and mTLS in native and JS
        run: |
          for s in http/ca-check.sh http/mtls-check.sh; do
            echo "== $s native"; sh "$s"
            echo "== $s js"; sh "$s" js
          done

  wire-tls-macos:
    needs: changes
    if: needs.changes.outputs.wire == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify runner and head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          actual=$(git rev-parse HEAD)
          printf 'tested=%s expected=%s\n' "$actual" "$EXPECTED_HEAD_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Bend
        run: |
          scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Select OpenSSL
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Check Wire CA and mTLS in native and JS
        env:
          WIRE_LOOPBACK_ONLY: '1'
        run: |
          for s in wire/ca-check.sh wire/mtls-check.sh; do
            echo "== $s native"; sh "$s"
            echo "== $s js"; sh "$s" js
          done

  hairpin-ca-macos:
    needs: changes
    if: needs.changes.outputs.hairpin == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify runner and head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          actual=$(git rev-parse HEAD)
          printf 'tested=%s expected=%s\n' "$actual" "$EXPECTED_HEAD_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Bend
        run: |
          scripts/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Select OpenSSL
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Check native Hairpin package
        run: |
          python3 -B scripts/rss-check.py bend hairpin/check.bend -o "$RUNNER_TEMP/hairpin-check"
          python3 -B hairpin/occupied-run.py "$RUNNER_TEMP/hairpin-check"
      - name: Check JavaScript Hairpin package
        run: |
          bend hairpin/check.bend -o "$RUNNER_TEMP/hairpin-check.js"
          python3 -B hairpin/occupied-run.py bun "$RUNNER_TEMP/hairpin-check.js"
      - name: Check Hairpin CA in native and JS
        run: |
          python3 -B scripts/rss-check.py sh hairpin/ca-check.sh
          sh hairpin/ca-check.sh js

  smoke:
    needs: changes
    if: needs.changes.outputs.http == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}-smoke', github.event.pull_request.number) || 'publish-smoke' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: http
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Bend
        run: ../scripts/install-bend.sh
      - name: Live fetch smoke
        continue-on-error: true
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          bend smoke.bend | tee smoke.out
          ! grep -q '^fail ' smoke.out
      - name: Local serving and streaming smokes in native and JS
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          bash local-smoke.sh

  gate:
    name: gate
    needs: [changes, workflow-lint, check, native-macos, stream-live, http-macos, http-tls-macos, wire-tls-macos, hairpin-ca-macos, smoke]
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed
        run: |
          case "${{ needs.changes.result }}" in
            success) ;;
            *) echo "changes is ${{ needs.changes.result }}"; exit 1 ;;
          esac
          case "${{ needs.workflow-lint.result }}" in
            success|skipped) ;;
            *) echo "workflow-lint is ${{ needs.workflow-lint.result }}"; exit 1 ;;
          esac
          case "${{ needs.check.result }}" in
            success|skipped) ;;
            *) echo "check is ${{ needs.check.result }}"; exit 1 ;;
          esac
          case "${{ needs.native-macos.result }}" in
            success|skipped) ;;
            *) echo "native-macos is ${{ needs.native-macos.result }}"; exit 1 ;;
          esac
          case "${{ needs.stream-live.result }}" in
            success|skipped) ;;
            *) echo "stream-live is ${{ needs.stream-live.result }}"; exit 1 ;;
          esac
          case "${{ needs.http-macos.result }}" in
            success|skipped) ;;
            *) echo "http-macos is ${{ needs.http-macos.result }}"; exit 1 ;;
          esac
          case "${{ needs.http-tls-macos.result }}" in
            success|skipped) ;;
            *) echo "http-tls-macos is ${{ needs.http-tls-macos.result }}"; exit 1 ;;
          esac
          case "${{ needs.wire-tls-macos.result }}" in
            success|skipped) ;;
            *) echo "wire-tls-macos is ${{ needs.wire-tls-macos.result }}"; exit 1 ;;
          esac
          case "${{ needs.hairpin-ca-macos.result }}" in
            success|skipped) ;;
            *) echo "hairpin-ca-macos is ${{ needs.hairpin-ca-macos.result }}"; exit 1 ;;
          esac
          case "${{ needs.smoke.result }}" in
            success|skipped) ;;
            *) echo "smoke is ${{ needs.smoke.result }}"; exit 1 ;;
          esac
