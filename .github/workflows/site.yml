name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build-container:
        description: Build the Linux native container for manual deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Bend
        run: scripts/install-bend.sh
      - name: Check README navigation
        run: python3 -m unittest discover -s site -p 'test_*.py'
      - name: Build the site
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          site/build.sh site/dist
      - name: Check native HTTP parity
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          bend site/server.bend -o site/out/server
          site/out/server +RTS --threads 1 --gpu off -RTS 8080 . https://bend-kit.paymahn.workers.dev $(scripts/packages.sh) &
          server=$!
          trap 'kill "$server"; wait "$server" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/llms.txt >/dev/null; then break; fi
            sleep 1
          done
          python3 site/live_check.py site/dist http://127.0.0.1:8080
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  container:
    if: github.event_name == 'workflow_dispatch' && inputs.build-container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build native image
        run: |
          docker build --platform linux/amd64 -f site/Dockerfile -t bend-kit-site:ci .
          docker save bend-kit-site:ci | gzip > bend-kit-site.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: bend-kit-site-image
          path: bend-kit-site.tar.gz
          retention-days: 7
