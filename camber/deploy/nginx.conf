# Render @STATE@ as a private absolute directory; certificate/key never in argv.
# Evidence uses 127.0.0.1:19444 and a disposable test CA. Public deployments
# replace listen/server_name/certificates, using an operator-managed trusted CA.
daemon off;
worker_processes 1;
pid @STATE@/nginx.pid;
error_log /dev/null crit; # nginx error logs can include request targets; opt out.
events { worker_connections 256; }
http {
  access_log off; # default combined logs expose query strings. Do not enable.
  server_tokens off;
  client_max_body_size 1m;
  client_header_timeout 5s;
  client_body_timeout 30s;
  send_timeout 30s;
  keepalive_timeout 30s;
  client_body_temp_path @STATE@/body;
  proxy_temp_path @STATE@/proxy;
  server {
    listen 127.0.0.1:19444 ssl;
    server_name localhost;
    ssl_certificate @STATE@/certificate.pem;
    ssl_certificate_key @STATE@/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    merge_slashes off;
    location / {
      # NO URI suffix, rewrite, variables, or path-based auth here: forward
      # the original origin-form target, including percent/query bytes.
      proxy_pass http://127.0.0.1:19441;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_next_upstream off; # never replay business work.
      proxy_connect_timeout 1s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }
    # No admin upstream. 19442 is private local process control only.
  }
}
